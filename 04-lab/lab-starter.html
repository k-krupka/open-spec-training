<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My page</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        color: #123b56;
        background: #f4f8fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background:
          linear-gradient(132deg, transparent 0 72%, rgb(0 146 119 / 8%) 72% 82%, transparent 82%),
          linear-gradient(312deg, transparent 0 78%, rgb(0 104 157 / 7%) 78% 87%, transparent 87%),
          #f4f8fa;
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        justify-content: center;
      }

      main {
        background: #fff;
        border: 1px solid #dce8ec;
        border-radius: 24px;
        box-shadow: 0 24px 70px rgb(18 59 86 / 12%);
        max-width: 680px;
        overflow: hidden;
        text-align: center;
        width: min(100%, 680px);
      }

      .brand-art {
        background: linear-gradient(115deg, #00689d, #009277 68%, #73bd44);
        display: block;
        height: 180px;
        object-fit: cover;
        width: 100%;
      }

      .content {
        padding: 36px 28px 44px;
      }

      .eyebrow {
        color: #00866a;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        margin: 0 0 12px;
        text-transform: uppercase;
      }

      h1 {
        color: #123b56;
        font-size: clamp(2rem, 7vw, 3.5rem);
        letter-spacing: -0.04em;
        margin: 0;
      }

      .accent {
        background: linear-gradient(90deg, #00689d, #009277, #73bd44);
        border-radius: 999px;
        height: 5px;
        margin: 22px auto 0;
        width: 76px;
      }

      @media (max-width: 480px) {
        body {
          padding: 16px;
        }

        .brand-art {
          height: 140px;
        }

        .content {
          padding: 30px 20px 36px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img
        class="brand-art"
        src="https://bag-p-001.sitecorecontenthub.cloud/api/public/content/bayer-identity-web-38635d83cf6a4ccc8fe4f657198a2686?v=e7026cd0"
        alt="Colorful Bayer brand design"
      >
      <div class="content">
        <p class="eyebrow">A personal page</p>
        <h1>John McClane</h1>
        <div class="accent" aria-hidden="true"></div>
      </div>
    </main>
  </body>
</html>
