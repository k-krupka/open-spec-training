schema: spec-driven
githubCopilot:
  cloudAgent: true

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
operations:
  apply:
    guidance:
      - For demo implementation tasks, do not invoke Playwright or browser tools, and do not run UI tests. Manual verification is sufficient; the user will verify demo results.
      - Skip extensive unit or integration testing for demos, and keep implementation limited to the requested demo output.
      - Mobile verification is not required for demo tasks; focus on manual review.
      - Focus on implementing only the requested demo output; avoid adding unrelated features or tests.
  archive:
    guidance:
      - Always sync the change's delta specs to the main specs before archiving.
      - When asked whether to sync or archive without syncing, choose sync and archive; do not ask the user.
      - If syncing fails, stop and report the problem instead of archiving.
      - Summarize the archive outcome before finishing
